<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-main: #06080d;
            --bg-sidebar: rgba(10, 12, 18, 0.9);
            --bg-card: rgba(18, 22, 32, 0.7);
            --accent: #00d2ff;
            --accent-hover: #3aedff;
            --accent-green: #00ff88;
            --accent-red: #ff2a2a;
            --accent-orange: #ff9d00;
            --text-main: #e0f0ff;
            --text-dim: #7a8a9a;
            --border: rgba(0, 210, 255, 0.25);
        }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-main);
            background-image: 
                linear-gradient(rgba(0, 210, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-main);
            font-family: 'Chakra Petch', sans-serif;
            display: flex; height: 100vh; overflow: hidden; user-select: none;
        }

        #sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; z-index: 10;
        }
        
        .logo-container {
            padding: 25px 20px; text-align: center; border-bottom: 1px solid var(--border);
            background: rgba(0, 210, 255, 0.05); position: relative;
        }
        .logo-container::after {
            content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }
        .logo-title {
            font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
        .logo-sub { font-size: 12px; color: var(--accent-green); letter-spacing: 1px; margin-top: 5px; }
        
        .nav-container { flex: 1; padding: 15px 0; overflow-y: auto; }
        
        .nav-btn {
            display: block; width: 100%; box-sizing: border-box;
            background: transparent; border: none; color: var(--text-dim);
            padding: 15px 25px; text-align: left; font-family: 'Chakra Petch', sans-serif;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s;
            border-left: 3px solid transparent; text-transform: uppercase; letter-spacing: 1px;
        }
        .nav-btn:hover {
            color: var(--text-main); background: rgba(0, 210, 255, 0.05);
            border-left: 3px solid var(--accent); padding-left: 30px;
            text-shadow: 0 0 5px var(--accent);
        }
        .nav-btn.active {
            color: #fff; background: rgba(0, 210, 255, 0.1);
            border-left: 3px solid var(--accent);
            box-shadow: inset 20px 0 20px -20px var(--accent);
        }

        #content-area { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 5; }
        #header {
            height: 70px; border-bottom: 1px solid var(--border); display: flex;
            align-items: center; justify-content: space-between; padding: 0 30px;
            background: rgba(10, 12, 18, 0.7); backdrop-filter: blur(5px);
        }
        #header-title {
            font-size: 22px; font-weight: 600; color: #fff; letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255,255,255,0.3); text-transform: uppercase;
        }
        
        #view-container { flex: 1; padding: 30px; overflow-y: auto; position: relative; }

        .card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px;
            padding: 25px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }
        .card::before {
            content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent);
        }
        .card-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; color: #fff; }
        .card-desc { font-size: 15px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.5; }
        
        .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .profile-stat {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05);
            padding: 15px; border-left: 3px solid var(--accent);
        }
        .stat-label { font-size: 13px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; }
        .stat-value { font-size: 24px; font-weight: 700; color: #fff; }
        .stat-value.money { color: var(--accent-green); text-shadow: 0 0 10px rgba(0,255,136,0.3); }

        .list-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 10px; border-left: 3px solid var(--accent); transition: 0.2s;
        }
        .list-row:hover { background: rgba(0,210,255,0.05); border-color: rgba(0,210,255,0.2); }
        .row-info { display: flex; flex-direction: column; }
        .row-title { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 5px; }
        .row-sub { font-size: 14px; color: var(--text-dim); max-width: 500px; }
        
        .btn {
            background: rgba(0,210,255,0.1); border: 1px solid var(--accent); color: var(--accent);
            padding: 8px 15px; font-family: 'Chakra Petch', sans-serif; font-size: 14px;
            font-weight: 600; cursor: pointer; transition: 0.2s; text-transform: uppercase;
        }
        .btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(0,210,255,0.4); }
        .btn-red { border-color: var(--accent-red); color: var(--accent-red); background: rgba(255,42,42,0.1); }
        .btn-red:hover { background: var(--accent-red); color: #000; box-shadow: 0 0 15px rgba(255,42,42,0.4); }

        .loader {
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;
        }
        .spinner {
            width: 50px; height: 50px; border: 3px solid rgba(0,210,255,0.1);
            border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    
        .darknet-theme {
            --bg-main: #030303 !important;
            --bg-sidebar: #050505 !important;
            --bg-card: rgba(0, 255, 0, 0.05) !important;
            --accent: #0f0 !important;
            --accent-hover: #fff !important;
            --accent-green: #0f0 !important;
            --text-main: #0f0 !important;
            --text-dim: #00aa00 !important;
            --border: #0f0 !important;
            font-family: 'Courier New', monospace !important;
        }
        .darknet-theme .logo-title {
            animation: glitch 2s infinite;
        }
        .darknet-theme .nav-btn {
            font-family: 'Courier New', monospace !important;
            border-bottom: 1px dashed #0f0;
        }
        .darknet-theme::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 200; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }
        .darknet-scanline {
            width: 100%; height: 100px;
            background: linear-gradient(0deg, rgba(0,255,0,0) 0%, rgba(0,255,0,0.1) 50%, rgba(0,255,0,0) 100%);
            position: absolute; opacity: 0.4; animation: scan 8s linear infinite; pointer-events: none; z-index: 201;
            display: none;
        }
        .darknet-theme .darknet-scanline { display: block; }
        
        .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .bounty-card { border: 1px dashed #f00; padding: 15px; background: rgba(255,0,0,0.05); margin-bottom: 15px; position:relative;}
        .bounty-card h3 { color: #f00; margin:0 0 10px 0; text-shadow: 0 0 5px #f00; }
        .bounty-reward { position:absolute; top:15px; right:15px; font-size:24px; color:#0f0; font-weight:bold; }
        
        .darknet-tabs { display:flex; gap:10px; margin-bottom:20px; border-bottom:1px solid #0f0; padding-bottom:10px;}
        .dn-tab { background:none; border:1px solid #0f0; color:#0f0; padding:10px 20px; cursor:pointer; font-family:monospace; }
        .dn-tab:hover, .dn-tab.active { background:#0f0; color:#000; font-weight:bold; }

    </style>
</head>
<body>
    <div class="darknet-scanline"></div>
    <div id="sidebar">
        <div class="logo-container">
            <div class="logo-title">SECURE.OS</div>
            <div class="logo-sub">FOUNDATION NETWORK</div>
        </div>
                <div class="nav-container" id="nav-menu"></div>
        <div style="flex-grow: 1;"></div>
        <button class="nav-btn" style="color: var(--accent-red); border-top: 1px solid var(--border);" onclick="gmod.closeTablet()">ЗАКРЫТЬ [ESC]</button>

    </div>
    
    <div id="content-area">
        <div id="header">
            <div id="header-title">ЗАГРУЗКА...</div>
        </div>
        <div id="view-container"></div>
    </div>

    <script>
        function setView(html) {
            document.getElementById('view-container').innerHTML = html;
        }
        
                function setLoading(tabId, title) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('nav-' + tabId);
            if(activeBtn) activeBtn.classList.add('active');
            
            if (tabId === 'Darknet') document.body.classList.add('darknet-theme');
            else document.body.classList.remove('darknet-theme');
            
            document.getElementById('header-title').innerText = title;
            setView('<div class="loader"><div class="spinner"></div><div style="color:var(--accent); font-weight:600; letter-spacing:2px">ЗАГРУЗКА...</div></div>');
            gmod.playSound('UI/buttonrollover.wav');
        }

        function setupSidebar(json) {
            const btns = JSON.parse(json);
            let html = '';
            btns.forEach(b => {
                html += `<button class="nav-btn" id="nav-${b.tab}" onclick="gmod.requestTab('${b.tab}')">${b.name}</button>`;
            });
            document.getElementById('nav-menu').innerHTML = html;
        }

        
        function renderDarknet(dataJson) {
            const data = JSON.parse(dataJson);
            
            let marketHtml = '<div class="market-grid">';
            data.items.forEach(item => {
                let priceMod = Math.random() > 0.5 ? 1 : -1;
                let trend = priceMod > 0 ? '<span style="color:#0f0">▲ +15%</span>' : '<span style="color:#f00">▼ -5%</span>';
                
                marketHtml += `
                    <div class="card" style="border: 1px solid #0f0; border-radius:0; background: rgba(0,255,0,0.02)">
                        <div style="font-size:18px; font-weight:bold; color:#0f0;">${item.name}</div>
                        <div style="color:#aaa; font-size:12px; margin-bottom:10px;">${item.category}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>${trend}<br>$${item.price}</div>
                            <button class="nav-btn" style="width:auto; border:1px solid #0f0; color:#0f0; padding:5px 10px; text-align:center;" onclick="gmod.buyItem('${item.id}')">ЗАКАЗАТЬ</button>
                        </div>
                    </div>
                `;
            });
            marketHtml += '</div>';

            setView(`
                <div class="darknet-tabs">
                    <button class="dn-tab active" onclick="switchDN('market')">БИРЖА ТЕНЕВОГО РЫНКА</button>
                    <button class="dn-tab" onclick="switchDN('bounties')">КОНТРАКТЫ НА ИГРОКОВ</button>
                </div>
                
                <div id="dn-market">
                    <p style="color:#aaa">Цены динамические. Товары доставляются в случайные тайники.</p>
                    ${marketHtml}
                </div>
                
                <div id="dn-bounties" style="display:none;">
                    <div class="bounty-card">
                        <h3>ЦЕЛЬ: Директор Зоны</h3>
                        <div class="bounty-reward">$15,000</div>
                        <div>Заказчик: Аноним<br>Требования: Без свидетелей.</div>
                        <button class="nav-btn" style="background:#f00; color:#000; text-align:center; margin-top:15px; font-weight:bold;">ПРИНЯТЬ КОНТРАКТ</button>
                    </div>
                </div>
            `);
        }

        function switchDN(tab) {
            document.getElementById('dn-market').style.display = 'none';
            document.getElementById('dn-bounties').style.display = 'none';
            document.getElementById('dn-' + tab).style.display = 'block';
            document.querySelectorAll('.dn-tab').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }


        function renderProfile(dataJson) {
            const data = JSON.parse(dataJson);
            setView(`
                <div class="card">
                    <div class="card-title">ЛИЧНОЕ ДЕЛО СОТРУДНИКА</div>
                    <div class="card-desc">Доступ к базе данных авторизован. Прикрепленные данные ниже.</div>
                    <div class="profile-grid">
                        <div class="profile-stat">
                            <div class="stat-label">ПОЗЫВНОЙ / ИМЯ</div>
                            <div class="stat-value">${data.name}</div>
                        </div>
                        <div class="profile-stat">
                            <div class="stat-label">ДОЛЖНОСТЬ</div>
                            <div class="stat-value" style="color: #ddd">${data.job}</div>
                        </div>
                        <div class="profile-stat" style="border-left-color: var(--accent-green)">
                            <div class="stat-label">ЛИЧНЫЙ СЧЕТ</div>
                            <div class="stat-value money">$${data.money}</div>
                        </div>
                        <div class="profile-stat" style="border-left-color: var(--accent-orange)">
                            <div class="stat-label">СТАТУС ДОСТУПА</div>
                            <div class="stat-value" style="color:var(--accent-orange)">АКТИВЕН</div>
                        </div>
                    </div>
                </div>
            `);
        }

        function renderQuests(dataJson) {
            const data = JSON.parse(dataJson);
            let html = '';
            data.quests.forEach(q => {
                const color = q.completed ? 'var(--accent-green)' : 'var(--accent)';
                const status = q.completed ? '[ ВЫПОЛНЕНО ]' : `[ ${q.progress} / ${q.goal} ]`;
                html += `
                    <div class="list-row" style="border-left-color: ${color}">
                        <div class="row-info">
                            <div class="row-title" style="color: ${color}">${q.name} <span style="font-size:16px; opacity:0.8; margin-left:10px">${status}</span></div>
                            <div class="row-sub">${q.desc}</div>
                        </div>
                        <div class="row-action">
                            <div style="color: var(--accent-green); font-weight: bold; font-size: 24px;">$${q.reward}</div>
                        </div>
                    </div>
                `;
            });
            setView(html);
        }

        function renderQuestsV2(dataJson) {
            // Alias: QuestSystem sends data under the V2 event name.
            // If QuestSystem's payload shape ever diverges from the classic
            // {quests: [...]} format used by renderQuests, adjust the mapping here.
            renderQuests(dataJson);
        }

        function renderShop(dataJson) {
            const data = JSON.parse(dataJson);
            let html = '<div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">';
            data.items.forEach(item => {
                html += `
                    <div class="card" style="margin-bottom:0; padding:20px;">
                        <div class="card-title" style="font-size:18px; color:var(--accent)">${item.name}</div>
                        <div style="color:var(--accent-green); font-size:20px; font-weight:bold; margin-bottom:15px;">$${item.price}</div>
                        <button class="btn" style="width:100%" onclick="alert('Куплено: ${item.name}')">ПРИОБРЕСТИ</button>
                    </div>
                `;
            });
            html += '</div>';
            setView(html);
        }

        function renderCraft(dataJson) {
            const data = JSON.parse(dataJson);
            let html = '<div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">';
            data.recipes.forEach(r => {
                html += `
                    <div class="card" style="margin-bottom:0; padding:20px; border-left-color:var(--accent-orange)">
                        <div class="card-title" style="font-size:18px; color:var(--accent-orange)">${r.name}</div>
                        <div style="color:var(--text-dim); font-size:14px; margin-bottom:15px;">Требуется: <span style="color:#fff">${r.ingredientsText}</span></div>
                    </div>
                `;
            });
            html += '</div>';
            setView(html);
        }

        function renderPatrols() {
            setView(`
                <div class="card" style="border-left-color: var(--accent)">
                    <div class="card-title">СИСТЕМА ПАТРУЛЕЙ</div>
                    <div class="card-desc">Начните патрулирование комплекса для получения премиальных выплат. Вам будут назначены точки маршрута.</div>
                    <button class="btn" style="font-size:18px; padding:15px 30px; margin-top:10px" onclick="alert('Патруль начат')">НАЧАТЬ ПАТРУЛЬ</button>
                </div>
            `);
        }

        function renderAdminHub() {
            setView(`
                <div class="card" style="border-left-color: var(--accent-red)">
                    <div class="card-title" style="color: var(--accent-red)">ПАНЕЛЬ АДМИНИСТРАТОРА</div>
                    <div class="card-desc">Экстренное управление комплексом и событиями.</div>
                    
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:20px;">
                        <button class="btn btn-red" onclick="alert('Breach triggered')">ОБЪЯВИТЬ НАРУШЕНИЕ</button>
                        <button class="btn btn-red" onclick="alert('Lights off')">ВЫКЛЮЧИТЬ ПИТАНИЕ</button>
                        <button class="btn btn-red" onclick="alert('Lights on')">ВКЛЮЧИТЬ ПИТАНИЕ</button>
                        <button class="btn btn-red" onclick="alert('Airdrop')">ВЫЗВАТЬ АИРДРОП</button>
                    </div>
                </div>
            `);
        }

        function renderRaids() {
            setView(`
                <div class="card" style="border-left-color: var(--accent-orange)">
                    <div class="card-title" style="color:var(--accent-orange)">ЗАПРОС НА РЕЙД</div>
                    <div class="card-desc">Отправка официального запроса на проведение рейда. Ожидается подтверждение другой стороны.</div>
                    
                    <div style="display:flex; flex-direction:column; gap: 15px; margin-top:20px;">
                        <div>
                            <label style="color:var(--accent-orange); font-weight:bold; font-size:14px; margin-bottom:5px; display:block;">ЦЕЛЬ РЕЙДА (ФРАКЦИЯ):</label>
                            <input type="text" id="raid-target" placeholder="Например: Фонд, ГОК, Повстанцы..." style="width:100%; box-sizing:border-box; background:rgba(0,0,0,0.5); border:1px solid var(--accent-orange); color:#fff; padding:10px; font-family:'Chakra Petch'; font-size:16px; outline:none;">
                        </div>
                        <div>
                            <label style="color:var(--accent-orange); font-weight:bold; font-size:14px; margin-bottom:5px; display:block;">ПРИЧИНА РЕЙДА:</label>
                            <textarea id="raid-reason" placeholder="Укажите RP причину..." style="width:100%; box-sizing:border-box; height:80px; background:rgba(0,0,0,0.5); border:1px solid var(--accent-orange); color:#fff; padding:10px; font-family:'Chakra Petch'; font-size:16px; outline:none; resize:none;"></textarea>
                        </div>
                        <button class="btn" style="width:100%; font-size:18px; margin-top:10px; border-color:var(--accent-orange); color:var(--accent-orange)" onclick="alert('Запрос на рейд фракции ' + document.getElementById('raid-target').value + ' отправлен!')">ОТПРАВИТЬ ЗАПРОС</button>
                    </div>
                </div>
            `);
        }

        function renderMessage(msg) {
            setView(`
                <div class="card" style="text-align:center; padding:40px;">
                    <div class="card-desc" style="font-size:17px; white-space:pre-line;">${msg}</div>
                </div>
            `);
        }

        function renderReports() {
            setView(`
                <div class="card" style="border-left-color: var(--accent)">
                    <div class="card-title">НОВЫЙ ОТЧЕТ</div>
                    <div class="card-desc">Отправьте отчет об инциденте, связанном с объектом SCP, в базу данных Зоны.</div>
                    <div style="display:flex; flex-direction:column; gap:15px;">
                        <div>
                            <label style="color:var(--accent); font-weight:bold; font-size:14px; margin-bottom:5px; display:block;">НОМЕР SCP:</label>
                            <input type="text" id="report-scp" placeholder="Например: SCP-173" style="width:100%; box-sizing:border-box; background:rgba(0,0,0,0.5); border:1px solid var(--accent); color:#fff; padding:10px; font-family:'Chakra Petch'; font-size:16px; outline:none;">
                        </div>
                        <div>
                            <label style="color:var(--accent); font-weight:bold; font-size:14px; margin-bottom:5px; display:block;">ТЕКСТ ОТЧЕТА:</label>
                            <textarea id="report-text" placeholder="Опишите инцидент подробно (мин. 10 символов)..." style="width:100%; box-sizing:border-box; height:120px; background:rgba(0,0,0,0.5); border:1px solid var(--accent); color:#fff; padding:10px; font-family:'Chakra Petch'; font-size:16px; outline:none; resize:none;"></textarea>
                        </div>
                        <button class="btn" style="width:100%; font-size:18px; margin-top:5px;" onclick="gmod.submitReport(document.getElementById('report-scp').value, document.getElementById('report-text').value)">ОТПРАВИТЬ ОТЧЕТ</button>
                    </div>
                </div>
            `);
        }

        function renderMTF() {
            setView(`
                <div class="card" style="border-left-color: var(--accent)">
                    <div class="card-title">СПОСОБНОСТИ ОТРЯДА МОГ</div>
                    <div class="card-desc">Используйте специальные способности вашего подразделения.</div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:10px;">
                        <button class="btn" onclick="gmod.mtfEpsilon()">ЭПСИЛОН-11: СКАНИРОВАНИЕ</button>
                        <button class="btn" onclick="gmod.mtfNu7()">НЮ-7: ЛЕЧЕНИЕ</button>
                        <button class="btn" onclick="gmod.mtfLambda()">ЛЯМБДА-5: ЯКОРЬ</button>
                    </div>
                </div>
            `);
        }

        function renderGOCTerminal(dataJson) {
            let points = [];
            try { points = JSON.parse(dataJson) || []; } catch (e) { points = []; }

            let rows = '';
            if (points.length) {
                points.forEach(p => {
                    rows += `
                        <div class="list-row">
                            <div class="row-info">
                                <div class="row-title">${p.name || p}</div>
                            </div>
                            <button class="btn" onclick="gmod.gocTeleport('${p.id || p.name || p}')">ТЕЛЕПОРТ</button>
                        </div>
                    `;
                });
            } else {
                rows = '<div class="card-desc">Точки телепортации ГОК не найдены. Вы можете ввести код вручную.</div>';
            }

            setView(`
                <div class="card" style="border-left-color: var(--accent)">
                    <div class="card-title">ТАКТИЧЕСКИЙ ТЕРМИНАЛ ГОК</div>
                    <div class="card-desc">Система квантовой телепортации и контроля позиций ГОК.</div>
                    
                    <div style="display:flex; gap:10px; margin-top:15px; margin-bottom:15px;">
                        <input type="text" id="goc-code" placeholder="Введите код точки..." style="flex-grow:1; background:rgba(0,0,0,0.5); border:1px solid var(--accent); color:var(--text-main); padding:10px; font-family:'Chakra Petch'; font-size:15px; outline:none;">
                        <button class="btn" style="border-color:var(--accent); color:var(--accent);" onclick="gmod.gocTeleport(document.getElementById('goc-code').value)">ТЕЛЕПОРТ</button>
                    </div>

                    <button class="btn" style="margin-bottom:15px; width:100%; border-color:#00ff88; color:#00ff88;" onclick="gmod.spawnGOCPad()">УСТАНОВИТЬ ТОЧКУ ЗДЕСЬ</button>
                </div>
                ${rows}
            `);
        }

        if(typeof gmod === 'undefined') {
            const _gmodMock = {
                requestTab: function(tabName) {
                    if (tabName === "Profile") {
                        setLoading(tabName, "ДОСЬЕ СОТРУДНИКА");
                        setTimeout(() => renderProfile(JSON.stringify({
                            name: "Агент Смит", job: "Командир МОГ", money: 5400
                        })), 300);
                    } else if (tabName === "Quests") {
                        setLoading(tabName, "ЖУРНАЛ ЗАДАЧ");
                        setTimeout(() => renderQuests(JSON.stringify({
                            quests: [
                                {name: "Уборка комплекса", desc: "Собрать мусор", goal: 5, progress: 2, reward: 500, completed: false}
                            ]
                        })), 300);
                    } else if (tabName === "Shop") {
                        setLoading(tabName, "МАГАЗИН");
                        setTimeout(() => renderShop(JSON.stringify({items: [{name:"Аптечка", price: 250, id: "medkit"}]})), 300);
                    } else if (tabName === "Craft") {
                        setLoading(tabName, "КРАФТ");
                        setTimeout(() => renderCraft(JSON.stringify({recipes: [{name:"Граната", ingredientsText:"Металл"}]})), 300);
                    } else if (tabName === "Patrols") {
                        setLoading(tabName, "ПАТРУЛЬ");
                        setTimeout(() => renderPatrols(), 300);
                    } else if (tabName === "Admin_Hub") {
                        setLoading(tabName, "АДМИН ПАНЕЛЬ");
                        setTimeout(() => renderAdminHub(), 300);
                    } else if (tabName === "Raids") {
                        setLoading(tabName, "РЕЙДЫ");
                        setTimeout(() => renderRaids(JSON.stringify({canDeclare:true})), 300);
                    } else if (tabName === "GOC_Terminal") {
                        setLoading(tabName, "ТЕРМИНАЛ ГОК");
                        setTimeout(() => renderGOCTerminal(JSON.stringify([{name: "База Альфа", id: "base_alpha"}])), 300);
                    }
                },
                buyItem: function(id) { alert("Куплено: " + id); },
                gocTeleport: function(code) { alert("Телепортация на: " + code); },
                spawnGOCPad: function() { alert("Платформа установлена"); },
                closeTablet: function() { alert("Закрыто"); }
            };
            window.gmod = _gmodMock;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.gmod && gmod.onReady) gmod.onReady();
        });
    </script>
</body>
</html>
